[package]
name = "create-horizon"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Converts the Create mod (NeoForge 1.21.1 source tree) into a Horizon content mod for Minecraft 26.3"

[[bin]]
name = "create-horizon"
path = "src/main.rs"

[dependencies]
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
